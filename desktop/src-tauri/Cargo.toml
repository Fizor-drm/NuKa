[package]
name = "nuka"
version = "1.3.4"
description = "NuKa desktop translation app (Powered by PLaMo 3 Translate)"
authors = ["NuKa"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "nuka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: トレイ常駐 (バックグラウンド実行) に使う。メニューは Tauri 2 の
# コア API (tauri::menu) なので、追加のプラグインは要らない。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
# 二重起動を防ぎ、2 個目の起動要求を既存プロセスへ渡す。
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "process",
    "sync",
    "time",
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
    "fs",
    "net",
] }
# llama-server はループバックの http なので TLS は要らないが、ランタイムとモデルの
# ダウンロード (https) に native-tls (Windows は schannel) を使う。
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "native-tls",
] }
futures-util = "0.3"
sha2 = "0.10"
whatlang = "0.18"
regex = "1"
thiserror = "2"
zip = "2"
url = "2"

# 子プロセス (llama-server) を Job Object で OS に後始末させるため (Windows のみ)。
# フローティングウィンドウの選択テキスト取得 (SendInput / GetAsyncKeyState)、
# カーソル位置とモニタ作業領域 (GetCursorPos / GetMonitorInfoW)、クリップボード
# (DataExchange / Memory)、debug ビルドの合成 Ctrl+C 対策 (SetConsoleCtrlHandler)
# も Windows API を使う。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
