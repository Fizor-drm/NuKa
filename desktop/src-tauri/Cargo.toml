[package]
name = "nuka"
version = "1.0.0"
description = "NuKa desktop translation app (Powered by PLaMo 3 Translate)"
authors = ["NuKa"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "nuka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "process",
    "sync",
    "time",
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
    "fs",
    "net",
] }
# llama-server はループバックの http なので TLS は要らないが、ランタイムとモデルの
# ダウンロード (https) に native-tls (Windows は schannel) を使う。
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "native-tls",
] }
futures-util = "0.3"
whatlang = "0.18"
regex = "1"
thiserror = "2"
zip = "2"

# 子プロセス (llama-server) を Job Object で OS に後始末させるため (Windows のみ)。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
