<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NuKa</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="floating-body">
    <main class="floating">
      <header class="floating-bar" id="floating-bar">
        <span class="floating-mark" aria-hidden="true">訳</span>
        <span class="floating-drag" aria-hidden="true"></span>
        <div class="floating-lang" id="floating-lang">
          <button
            type="button"
            class="floating-lang-button"
            id="floating-lang-button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="floating-lang-popover"
            data-i18n-aria-label="floating.targetLangAria"
          >
            <span class="floating-lang-label" id="floating-lang-label">日本語</span>
            <svg
              class="icon floating-lang-chevron"
              viewBox="0 0 24 24"
              width="12"
              height="12"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <ul
            class="floating-lang-popover"
            id="floating-lang-popover"
            role="listbox"
            tabindex="-1"
            data-i18n-aria-label="floating.targetLangAria"
            hidden
          ></ul>
        </div>
        <button
          type="button"
          class="floating-copy"
          id="floating-copy"
          aria-disabled="true"
          data-i18n-title="floating.copy"
        >
          <span id="floating-copy-label" data-i18n="floating.copy">コピー</span>
        </button>
        <button
          type="button"
          class="floating-close"
          id="floating-close"
          data-i18n-title="floating.close"
          data-i18n-aria-label="floating.close"
          title="閉じる"
          aria-label="閉じる"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="m6 6 12 12" />
            <path d="m18 6-12 12" />
          </svg>
        </button>
      </header>
      <section class="floating-content" id="floating-content" aria-live="polite">
        <p class="floating-message" id="floating-message"></p>
        <div class="floating-text" id="floating-text" hidden></div>
      </section>
      <!-- 右下のリサイズつまみ。見た目だけの装飾で、操作は floating.ts が持つ。 -->
      <div class="floating-grip" id="floating-grip" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/floating.ts"></script>
  </body>
</html>
