<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PLaMo 3 Translate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="mast">
      <p class="mark">PLaMo <span>3</span></p>
      <h1>このページを訳す</h1>
      <p class="status" id="bridge" role="status">ブリッジを確認しています</p>
    </header>

    <form id="form">
      <label class="field">
        <span>訳先</span>
        <select id="target" name="targetLang"></select>
      </label>

      <label class="field">
        <span>原文の言語</span>
        <select id="source" name="sourceLang">
          <option value="">ページから判断する</option>
        </select>
      </label>

      <fieldset class="field" id="form-field">
        <legend>日本語の文体</legend>
        <label><input type="radio" name="form" value="" checked /> 指定しない</label>
        <label><input type="radio" name="form" value="plain" /> 普通体 (だ・である)</label>
        <label><input type="radio" name="form" value="polite" /> 丁寧体 (です・ます)</label>
      </fieldset>

      <label class="field grow">
        <span>用語 <small>1行に「原文 = 訳語」</small></span>
        <textarea id="glossary" name="glossary" rows="4" spellcheck="false" placeholder="管理画面 = dashboard"></textarea>
      </label>

      <p class="count" id="count" aria-live="polite"></p>

      <div class="actions">
        <button type="button" class="primary" id="translate">ページを訳す</button>
        <button type="button" id="stop" disabled>止める</button>
        <button type="button" id="restore">原文に戻す</button>
      </div>

      <p class="progress" id="progress" role="status" aria-live="polite"></p>
      <p class="error" id="error" role="alert" hidden></p>
    </form>

    <script type="module" src="popup.js"></script>
  </body>
</html>
